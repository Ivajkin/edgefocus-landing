<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="ufo-title ufo-desc" shape-rendering="crispEdges">
  <title id="ufo-title">Your brain called. Its flying saucer is here.</title>
  <desc id="ufo-desc">A smiling green alien pilots a chrome flying saucer, beaming up a yellow folder and a shower of colorful floppy disks and paper notes.</desc>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ff00" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#eaff00" stop-opacity=".23"/>
      <stop offset="1" stop-color="#9eff00" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00faff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#007aff" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <!-- The rescue beam is all ray-gun green, with no opaque background. -->
  <path d="M165 143H255L371 332H49Z" fill="url(#beam)"/>
  <path d="M174 156L80 319M245 156L339 319" fill="none" stroke="#dbff00" stroke-width="3" opacity=".65"/>
  <path d="M190 167L152 302M229 167L265 302" fill="none" stroke="#faff7a" stroke-width="2" stroke-dasharray="7 13" opacity=".6"/>

